<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carregador Inteligente - Gadget Boom Tech</title>
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background-color: #f4f4f4;
      padding-bottom: 60px; /* evita sobreposição do footer */
    }
    header {
      background-color: #0300af;
      color: #fff;
      padding: 15px;
      text-align: center;
    }
    .logo {
      max-width: 100px;
      height: auto;
      display: block;
      margin: 0 auto 10px;
    }
    .produto {
      max-width: 900px;
      margin: 40px auto;
      background: #fff;
      padding: 20px;
      border-radius: 8px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      text-align: center;
    }
    .produto img {
      max-width: 100%;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .btn-comprar {
      display: inline-block;
      padding: 12px 20px;
      background-color: #0077cc;
      color: #fff;
      text-decoration: none;
      border-radius: 5px;
      font-weight: bold;
      transition: background-color 0.3s, transform 0.2s;
    }
    .btn-comprar:hover {
      background-color: #005fa3;
      transform: scale(1.05);
    }
    footer {
      background-color: #222;
      color: #fff;
      text-align: center;
      padding: 10px;
      position: fixed;
      bottom: 0;
      width: 100%;
    }
    @media (max-width: 768px) {
      .produto {
        margin: 20px;
        padding: 15px;
      }
    }
  </style>
</head>
<body>
  <header>
    <img src="images/LOGO.png" alt="Logo Gadget Boom Tech" class="logo">
    <h1>Gadget Boom Tech</h1>
  </header>

  <div class="produto">
    <img src="images/carregador.jpg" alt="Carregador Inteligente">
    <h2>Carregador Inteligente</h2>
    <p>Carregamento rápido e seguro para todos os seus dispositivos. Compatível com smartphones, tablets e acessórios modernos.</p>
    <p><strong>Preço:</strong> R$ 199,90</p>
    <a href="contato.html" class="btn-comprar">Comprar Agora</a>
  </div>

  <footer>
    <p>&copy; 2026 GadgetBoomTech - Todos os direitos reservados</p>
  </footer>
</body>
</html>
